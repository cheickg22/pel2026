server {
    listen 80;
    server_name confort.abdatytch.com www.confort.abdatytch.com;
    
    # Redirection HTTP vers HTTPS (après installation SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name confort.abdatytch.com www.confort.abdatytch.com;

    # SSL Certificate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/confort.abdatytch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confort.abdatytch.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory pour le frontend
    root /var/www/confort.abdatytch.com/frontend/dist;
    index index.html;

    # Client max body size (pour upload de fichiers)
    client_max_body_size 50M;

    # Frontend - React App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://unix:/var/www/confort.abdatytch.com/backend/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://unix:/var/www/confort.abdatytch.com/backend/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files (Django)
    location /static/ {
        alias /var/www/confort.abdatytch.com/backend/staticfiles/;
    }

    # Media files (uploads)
    location /media/ {
        alias /var/www/confort.abdatytch.com/backend/media/;
    }

    # Logs
    access_log /var/log/nginx/confort_access.log;
    error_log /var/log/nginx/confort_error.log;
}
